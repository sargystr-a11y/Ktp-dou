<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кабинет КТП ДОУ</title><style>body{font:15px Arial;background:#fbf6f3;color:#382b30;margin:0}.wrap{max-width:760px;margin:35px auto;padding:25px}h1{font:38px Georgia;color:#633a48}form{background:white;padding:25px;border:1px solid #eadbd8}label{display:block;margin:16px 0 6px}input,select{display:block;width:100%;padding:12px;border:1px solid #d9c9c8;box-sizing:border-box}button{background:#633a48;color:white;border:0;padding:15px 22px;margin-top:22px;font-size:15px}small{color:#75666b}.status{margin-top:18px;white-space:pre-wrap}</style></head><body><main class="wrap"><a href="/">← Главная</a><h1>Создать КТП на неделю</h1><p>Подготовьте три документа своего ДОУ. Поддерживаются DOCX, PDF с текстовым слоем, TXT и XLSX. Максимум 15 МБ на файл.</p><form id="f"><label>Возрастная группа</label><select name="age" required><option>Ранний возраст · 1,5–3 года</option><option>Младшая группа · 3–4 года</option><option>Средняя группа · 4–5 лет</option><option>Старшая группа · 5–6 лет</option><option>Подготовительная группа · 6–7 лет</option></select><label>Тема недели</label><input name="theme" maxlength="180" required placeholder="Например: Осень в нашем городе"><label>Понедельник — дата начала недели</label><input type="date" name="start_date" required><label>1. Шаблон КТП вашего ДОУ</label><input type="file" name="template" accept=".docx,.pdf,.txt,.xlsx" required><label>2. Перспективный план</label><input type="file" name="perspective" accept=".docx,.pdf,.txt,.xlsx" required><label>3. Картотека игр</label><input type="file" name="games" accept=".docx,.pdf,.txt,.xlsx" required><button id="b">Сформировать КТП в Word</button><div class="status" id="s"></div></form><p><small>Не загружайте персональные данные детей и конфиденциальные документы. Итог — черновик, его нужно проверить.</small></p></main><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('b'),s=document.getElementById('s');b.disabled=true;s.textContent='Формируем документ…';try{const r=await fetch('/api/generate',{method:'POST',body:new FormData(e.target)});if(!r.ok){const t=await r.text();throw new Error(t)}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='KTP_DOU.docx';a.click();URL.revokeObjectURL(url);s.textContent='Готово. Проверьте документ перед использованием.'}catch(err){s.textContent='Не удалось сформировать документ: '+err.message}finally{b.disabled=false}});</script></body></html>
